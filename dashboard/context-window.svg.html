<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DéjàVu Memory Dashboard</title>
<style>
body{font-family:Inter,system-ui,sans-serif;margin:0;background:#0b1020;color:#eef2ff}main{max-width:1100px;margin:40px auto;padding:0 20px}.top{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}h1{margin:0;font-size:30px}.muted{color:#94a3b8}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0}.card,.chart{background:#141b34;border:1px solid #26314f;border-radius:16px;padding:20px}.value{font-size:28px;font-weight:750;margin-top:5px}.chart{overflow-x:auto}svg{width:100%;min-width:700px;height:auto}.grid{stroke:#334155;stroke-width:1}.axis{fill:#94a3b8;font-size:12px}.context{fill:none;stroke:#34d399;stroke-width:4}.budget{fill:none;stroke:#f59e0b;stroke-width:3;stroke-dasharray:8 6}.memory{fill:none;stroke:#a78bfa;stroke-width:4}.legend{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0 18px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.status{padding:8px 12px;border-radius:999px;background:#1e293b;font-size:13px}button{background:#eef2ff;color:#0b1020;border:0;border-radius:9px;padding:9px 13px;font-weight:650;cursor:pointer}@media(max-width:650px){.cards{grid-template-columns:1fr}}
</style></head>
<body><main>
<div class="top"><div><h1>DéjàVu Memory Dashboard</h1><div class="muted">Live from RawTree · dejavu_agent_runs</div></div><div><span id="status" class="status">Loading…</span> <span id="updated" class="muted"></span> <button id="refresh">Refresh now</button></div></div>
<div class="cards"><div class="card"><div class="muted">Institutional memories</div><div id="mem" class="value">—</div></div><div class="card"><div class="muted">Working context</div><div id="ctx" class="value">—</div></div><div class="card"><div class="muted">Context budget</div><div id="budget" class="value">—</div></div></div>
<div class="chart"><h2>Lifetime memory vs working context</h2><div class="legend"><span><i class="dot" style="background:#a78bfa"></i>Total memories</span><span><i class="dot" style="background:#34d399"></i>Context tokens</span><span><i class="dot" style="background:#f59e0b"></i>Context budget</span></div><svg id="plot" viewBox="0 0 900 460" role="img" aria-label="RawTree agent run metrics"></svg><div id="error" class="muted"></div></div>
<script>
const API="/api/dashboard";
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function line(points,w,h,p,max,key){return points.map((d,i)=>{const x=p+i*(w-2*p)/Math.max(1,points.length-1),y=h-p-(Number(d[key])||0)*(h-2*p)/max;return x+","+y}).join(" ")}
function render(rows){if(!rows.length)throw Error("No dejavu_agent_runs rows yet.");const svg=document.getElementById("plot"),w=900,h=460,p=65;const max=Math.max(...rows.flatMap(r=>[+r.total_memories||0,+r.context_tokens||0,+r.context_budget||0]),1);let s="";for(let i=0;i<=4;i++){let y=p+i*(h-2*p)/4,v=Math.round(max*(1-i/4));s+=`<line x1="${p}" y1="${y}" x2="${w-p}" y2="${y}" class="grid"/><text x="12" y="${y+4}" class="axis">${v}</text>`}s+=`<polyline class="memory" points="${line(rows,w,h,p,max,"total_memories")}"/><polyline class="context" points="${line(rows,w,h,p,max,"context_tokens")}"/><polyline class="budget" points="${line(rows,w,h,p,max,"context_budget")}"/>`;rows.forEach((r,i)=>{const x=p+i*(w-2*p)/Math.max(1,rows.length-1);s+=`<text x="${x}" y="${h-20}" text-anchor="middle" class="axis">${esc(r.scenario)}</text>`});svg.innerHTML=s;const last=rows[rows.length-1];document.getElementById("mem").textContent=last.total_memories;document.getElementById("ctx").textContent=last.context_tokens+" tokens";document.getElementById("budget").textContent=last.context_budget+" tokens";document.getElementById("status").textContent=rows.length+" RawTree runs";}
async function load(){document.getElementById("error").textContent="";try{const r=await fetch(API);if(!r.ok)throw Error(await r.text());render(await r.json())}catch(e){document.getElementById("status").textContent="API unavailable";document.getElementById("error").textContent=e.message}}
document.getElementById("refresh").onclick=load;load();setInterval(load,5000);
</script></main></body></html>
