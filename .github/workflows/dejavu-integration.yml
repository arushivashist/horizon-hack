name: DejaVu Integration
on:
  push:
    branches: [main]
    paths: ['src/dejavu/**','scripts/**','.github/workflows/dejavu-integration.yml']
  workflow_dispatch:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/run_integration.py
  rawtree-ingest:
    runs-on: ubuntu-latest
    env:
      RAWTREE_API_KEY: ${{ secrets.TINYBIRD_TOKEN }}
      RAWTREE_URL: https://api.rawtree.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Ingest and verify scenario snapshots in RawTree
        run: python scripts/ingest_tinybird.py
      - name: Ingest preserved 30-day Claude experiment into RawTree
        run: python scripts/ingest_experiment_rawtree.py
  sponsor-pipeline:
    needs: rawtree-ingest
    runs-on: ubuntu-latest
    env:
      RAWTREE_API_KEY: ${{ secrets.TINYBIRD_TOKEN }}
      RAWTREE_URL: https://api.rawtree.com
      NIMBLE_API_KEY: ${{ secrets.NIMBLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/run_sponsor_pipeline.py
