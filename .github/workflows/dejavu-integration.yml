name: DejaVu Integration
on:
  push:
    branches: [main]
    paths: ['src/dejavu/**','scripts/**','.github/workflows/dejavu-integration.yml']
  workflow_dispatch:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/run_integration.py
  sponsor-pipeline:
    runs-on: ubuntu-latest
    env:
      TINYBIRD_TOKEN: ${{ secrets.TINYBIRD_TOKEN }}
      NIMBLE_API_KEY: ${{ secrets.NIMBLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/run_sponsor_pipeline.py
