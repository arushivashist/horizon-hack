name: DejaVu Integration
on:
  push:
    branches: [main]
    paths: ['src/dejavu/**','scripts/**','tinybird/**','.github/workflows/dejavu-integration.yml']
  workflow_dispatch:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/run_integration.py
  tinybird-ingest:
    runs-on: ubuntu-latest
    env:
      TINYBIRD_TOKEN: ${{ secrets.TINYBIRD_TOKEN }}
      TINYBIRD_URL: ${{ vars.TINYBIRD_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Ingest Day 4 and Day 9 mock data
        run: python scripts/ingest_tinybird.py
  sponsor-pipeline:
    needs: tinybird-ingest
    runs-on: ubuntu-latest
    env:
      TINYBIRD_TOKEN: ${{ secrets.TINYBIRD_TOKEN }}
      TINYBIRD_URL: ${{ vars.TINYBIRD_URL }}
      NIMBLE_API_KEY: ${{ secrets.NIMBLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/run_sponsor_pipeline.py
