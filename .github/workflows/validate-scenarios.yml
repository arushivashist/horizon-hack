name: Validate DejaVu scenarios
on:
  push:
    branches: [main]
    paths:
      - 'scripts/validate_scenarios.py'
      - '.github/workflows/validate-scenarios.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run mock-data scenario validation
        run: python scripts/validate_scenarios.py
