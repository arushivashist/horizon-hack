// ---------------- the month (Day 1 is a Monday) ----------------

const SCENES = [

// ============================================================
// renderer
// ============================================================
const canvas = document.getElementById('stage');
let renderer = null;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' }); }
catch { document.getElementById('fallback').textContent = 'This view needs WebGL. The captions still tell the story.'; }
if (renderer) {
  document.getElementById('fallback').hidden = true;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
}
const DAY_SKY = new THREE.Color(0xa9c3d8), NIGHT_SKY = new THREE.Color(0x070c15);
const scene = new THREE.Scene();
scene.background = DAY_SKY.clone();
scene.fog = new THREE.Fog(DAY_SKY.getHex(), 30, 110);
const camera = new THREE.PerspectiveCamera(46, 1, 0.04, 400);
camera.position.set(10.8, 4.7, 11.5);
const camLook = new THREE.Vector3(0, 3, -4);

let composer, bloom;
if (renderer) {
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.3, 0.4, 0.93);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());
}

// ---------------- helpers ----------------
const easeIO = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeBack = (t) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;

// clean cartoon look: 3-band toon shading plus ink outlines on characters and hero props
const grad = new THREE.DataTexture(new Uint8Array([90, 90, 90, 255, 170, 170, 170, 255, 255, 255, 255, 255]), 3, 1, THREE.RGBAFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter;
grad.needsUpdate = true;
const toon = (color, o = {}) => new THREE.MeshToonMaterial({ color, gradientMap: grad, ...o });
const INK = new THREE.MeshBasicMaterial({ color: 0x14161c, side: THREE.BackSide });
function ink(mesh, s = 1.05) {
  const o = new THREE.Mesh(mesh.geometry, INK);
  o.scale.setScalar(s);
  o.raycast = () => {};
  mesh.add(o);
  return mesh;
}
function box(w, h, d, mat, x, y, z, parent, outline = false) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  if (outline) {
    const o = new THREE.Mesh(m.geometry, INK);
    o.scale.set(1 + 0.03 / w, 1 + 0.03 / h, 1 + 0.03 / d);
    m.add(o);
  }
  (parent || scene).add(m);
  return m;
}
function part(geo, mat, x, y, z, parent, outline = 1.06) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  if (outline) ink(m, outline);
  parent.add(m);
  return m;
}
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  draw?.(ctx, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return { c, ctx, t };
}
function sprite(text, { color = HEX.ink, size = 0.3, bg = 'rgba(12,16,24,0.86)' } = {}) {
  const px = 64;
  const probe = document.createElement('canvas').getContext('2d');
  probe.font = `600 ${px}px 'IBM Plex Mono', monospace`;
  const w = Math.ceil(probe.measureText(text).width) + 60;
  const { t, c } = canvasTex(w, px + 36, (ctx, W, H) => {
    ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(0, 0, W, H, H / 2); ctx.fill();
    ctx.font = `600 ${px}px 'IBM Plex Mono', monospace`;
    ctx.fillStyle = color; ctx.textBaseline = 'middle';
    ctx.fillText(text, 30, H / 2 + 3);
  });
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false, toneMapped: false }));
  s.scale.set((size * c.width) / c.height, size, 1);
  return s;
}

// floor: light oak planks, charcoal carpet in the event area

// walls: navy acoustic wall (left), oak slat wall (right)
const navyWall = box(0.3, CEIL, 19, toon(NAVY), -12, CEIL / 2, 1.5);

function place(mesh, a, b) {
  mesh.position.copy(a).add(b).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
}
function makeArm(parent, sleeve, skin, shoulder, a = 0.4, b = 0.38) {
  const upper = part(new THREE.CapsuleGeometry(0.085, a, 4, 12), sleeve, 0, 0, 0, parent, 1.1);
  const fore = part(new THREE.CapsuleGeometry(0.075, b, 4, 12), sleeve, 0, 0, 0, parent, 1.1);
  const cuff = new THREE.Object3D();                  // placeholder; the sleeve runs to the hand
  // open hand: flat palm in the XY plane (palm faces +z), four fingers up, thumb out to the side
  // chunky cartoon hand: rounded palm (faces +z), four stubby fingers pointing +y, thumb out the side
  const hand = new THREE.Group(); parent.add(hand); hand.scale.setScalar(1.2);
  part(new THREE.SphereGeometry(0.082, 18, 14), skin, 0, 0, 0, hand, 1.1).scale.set(1, 1.02, 0.56);
  for (let i = 0; i < 4; i++) {
    const f = part(new THREE.CapsuleGeometry(0.023, 0.05, 4, 10), skin, -0.054 + i * 0.036, 0.098 + (i === 1 || i === 2 ? 0.01 : 0), 0, hand, 1.14);
    f.rotation.z = (1.5 - i) * 0.06;
  }
  const thumb = part(new THREE.CapsuleGeometry(0.025, 0.05, 4, 10), skin, 0.085, 0.018, 0.008, hand, 1.14);
  thumb.rotation.z = -0.95;
  return { upper, fore, cuff, hand, S: shoulder.clone(), a, b, cur: null };
}
// two-bone reach: places upper arm, forearm and hand to touch `target` (parent space)
function reach(arm, target, pole, k) {
  if (!arm.cur) arm.cur = target.clone();
  arm.cur.lerp(target, k);
  const S = arm.S, to = arm.cur.clone().sub(S);
  const d = clamp(to.length(), 0.08, arm.a + arm.b - 0.002);
  const dir = to.normalize();

  const perp = pole.clone().addScaledVector(dir, -pole.dot(dir)).normalize();
  const E = S.clone().addScaledVector(dir, arm.a * cosA).addScaledVector(perp, arm.a * sinA);
  const P = S.clone().addScaledVector(dir, d);
  place(arm.upper, S, E);
  place(arm.fore, E, P);
  place(arm.cuff, P.clone().lerp(E, 0.12), P);
  arm.hand.position.copy(P).addScaledVector(P.clone().sub(E).normalize(), 0.05);
  arm.hand.quaternion.copy(arm.fore.quaternion);
}

// Dejavu's cursor: glides between reading points; `marks` light up what it reads
function readCursor(ctx, t, pts) {
  let i = 0; while (i < pts.length - 1 && t >= pts[i + 1][0]) i++;
  const [t0, x0, y0] = pts[i], [t1, x1, y1] = pts[Math.min(i + 1, pts.length - 1)];
  const k = t1 > t0 ? easeIO(clamp((t - t0) / Math.min(0.9, t1 - t0))) : 1;
  const x = lerp(x0, x1, k), y = lerp(y0, y1, k);
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = HEX.sodium; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 40); ctx.lineTo(11, 30); ctx.lineTo(20, 48); ctx.lineTo(27, 44); ctx.lineTo(18, 27); ctx.lineTo(32, 27); ctx.closePath(); ctx.fill(); ctx.stroke();

  ctx.restore();
}
function markRead(ctx, t, from, x, y, w, h, outline = false) {
  const a = clamp((t - from) * 3);
  if (a <= 0) return;
  if (outline) { ctx.strokeStyle = `rgba(255, 205, 80, ${a})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.roundRect(x, y, w, h, 8); ctx.stroke(); return; }
  ctx.fillStyle = `rgba(255, 205, 80, ${0.32 * a})`;
  ctx.fillRect(x, y, w * easeIO(a), h);
}

}
function avatar(ctx, x, y, r, col, letter) {

  const a = clamp((t - from) * 2.5); if (a <= 0) return;

  phoneScreenMat.color.setRGB(0.04 + glow * 0.9, 0.07 + glow * 0.55, 0.12 + glow * 0.12);

  // ---- small life ----
  steam.forEach((s) => { const p = (T * 0.3 + s.userData.phase) % 1; s.position.set(-1.7 + Math.sin(p * 5 + s.userData.phase * 9) * 0.04, 1.82 + p * 0.6, -1.5); s.scale.setScalar(0.6 + p * 1.5); s.material.opacity = 0.14 * (1 - p) * m; });
  const hopD = (T % 7) < 0.5 ? Math.sin(((T % 7) / 0.5) * Math.PI) : 0;
  duck.position.y = 1.5 + hopD * 0.1 * m;

  // ---- Liquid: the always-on watcher, patrolling above the desk ----
  drone.visible = true;
  drone.position.set(0.9 + Math.sin(T * 0.5) * 0.5, 3.45 + Math.sin(T * 1.4) * 0.05, -1.2 + Math.cos(T * 0.4) * 0.25);
  drone.scale.setScalar(1);
  drone.rotation.z = Math.sin(T * 0.9) * 0.06;
  droneTag.material.opacity = clamp((camera.position.distanceTo(drone.position) - 1.5) / 1.5);
  rotors.forEach((r) => (r.rotation.z += dt * 40));
  if (sc.timelapse && TL.day < 30) {
    tlTimer -= dt;
    if (tlTimer <= 0) { tlTimer = 0.55; spawnBubble(false); }
    for (const d of RUN.incidents) if (tlLast < d && TL.day >= d) spawnBubble(true);
    tlLast = TL.day;
  }
  if (sc.watch) {
    bubbleTimer -= dt;
    if (bubbleTimer <= 0 && sceneT < 5) { bubbleTimer = 1.3; spawnBubble(false); }
    if (sceneT > 5 && !realSent) { realSent = true; spawnBubble(true); }
  }
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i], u = b.userData;
    u.t += dt / 1.4;
    if (u.real) {
      // the real alert: the watcher lets it through to the agent's head
      const tgt = botHead.getWorldPosition(v3).add(v3b.set(0, 0.45, 0));
      const p = clamp(u.t / 1.2);
      b.position.lerpVectors(u.from, tgt, easeIO(p)).add(v3b.set(0, Math.sin(p * Math.PI) * 0.35, 0));
      if (p >= 1) { burst(tgt.clone(), 0xff6a4d); scene.remove(b); bubbles.splice(i, 1); }
    } else {
      // false alarms: caught and popped by the watcher
      const p = clamp(u.t);
      b.position.lerpVectors(u.from, drone.position, easeIO(p)).add(v3b.set(u.bend * Math.sin(p * Math.PI) * 0.4, 0.2 * Math.sin(p * Math.PI), 0));
      if (p >= 1) { burst(b.position.clone(), COL.sodium); scene.remove(b); bubbles.splice(i, 1); }
    }
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i], u = p.userData;
    u.life -= dt * 1.8; p.position.addScaledVector(u.v, dt); u.v.y -= dt * 2;
    const fl = groundAt(p.position); if (p.position.y < fl) { p.position.y = fl; u.v.set(0, 0, 0); }
    p.material.opacity = Math.max(0, u.life);
    if (u.life <= 0) { scene.remove(p); sparks.splice(i, 1); }
  }
  for (let i = confetti.length - 1; i >= 0; i--) {
    const p = confetti[i], u = p.userData;
    u.life -= dt;
    if (!u.landed) {
      u.v.y = Math.max(u.v.y - dt * 3.2, -1.2); u.v.x *= 1 - dt * 1.2; u.v.z *= 1 - dt * 1.2;
      p.position.addScaledVector(u.v, dt);
      p.position.x += Math.sin(T * 2.5 + u.spin) * 0.2 * dt;
      p.rotation.x += u.spin * dt; p.rotation.y += u.spin * 0.7 * dt;
      const fl = groundAt(p.position) + 0.004;
      if (p.position.y <= fl) { p.position.y = fl; u.landed = true; p.rotation.set(-Math.PI / 2, 0, Math.random() * 3); }
    }
    p.material.opacity = clamp(u.life);
    if (u.life <= 0) { scene.remove(p); confetti.splice(i, 1); }
  }

  // ---- the brain: open the cap, glow, fly in, and play the holograms ----
  const capTarget = sc.brain ? (sc.brain === 'enter' ? (sceneT > 0.9 ? 1 : 0) : 1) : 0;
  capOpen += (capTarget - capOpen) * (1 - Math.exp(-dt * 3.2));
  capHinge.rotation.x = -1.35 * easeIO(clamp(capOpen));
  brainGlowMat.opacity = clamp(capOpen * 1.4);
  brainGlow.visible = capOpen > 0.02;
  brainGlow.scale.setScalar(1 + Math.sin(T * 4) * 0.05);
  brainLight.intensity = 3 * capOpen;
  const inside = !!sc.brain && (sc.brain !== 'enter' || sceneT >= 3.2);
  brainWorld.visible = inside;
  const fl = sc.brain === 'enter' ? (sceneT < 3.2 ? clamp((sceneT - 2.6) / 0.6) : 1 - clamp((sceneT - 3.2) / 0.8)) : 0;
  flashEl.style.opacity = fl.toFixed(3);
  if (inside) {
    brainWorld.children[1].rotation.y += dt * 0.02; brainWorld.children[2].rotation.y += dt * 0.02;
    if (sc.brain === 'enter') { flowPage(holoFlow.tex.ctx, sceneT - 3.2); holoFlow.tex.t.needsUpdate = true; }
    else { chartPage(holoChart.tex.ctx, sceneT); holoChart.tex.t.needsUpdate = true; }
  }

  // ---- Nimble beam: vendor watch ----
  const beamOn = sc.beam ? clamp((sceneT - 0.8) * 1.2) : 0;
  beamMat.opacity += (0.85 * beamOn - beamMat.opacity) * Math.min(1, dt * 4);
  if (motion) dash.t.offset.x -= dt * 1.2;
  beamCards.forEach((c) => {
    const p = (T * 0.14 + c.userData.phase) % 1;
    c.visible = beamMat.opacity > 0.05;
    c.position.copy(beamCurve.getPointAt(p)).add(v3.set(0, 0.22 * (1 - p), 0));
    const s = 0.3 + (1 - p) * 1.0;
    c.scale.set(0.9 * s, 0.32 * s, 1);
    c.material.opacity = beamMat.opacity * Math.min(1, (1 - p) * 6, p * 8);
  });
  dockRing.material.opacity = beamMat.opacity * (0.6 + 0.4 * Math.sin(T * 4));
  dockRing.scale.setScalar(1 + ((T * 0.6) % 1) * 0.5);
  dockRing.lookAt(camera.position);

  fogBanks.forEach((f) => { if (motion) { f.position.x += f.userData.speed * dt; if (f.position.x > 90) f.position.x = -90; } });

  if ((screenFrame++ & 1) === 0) drawScreen();
  if (composer) composer.render(dt);
  requestAnimationFrame(frame);
}

go(0);
sync();
requestAnimationFrame(frame);
</script>
